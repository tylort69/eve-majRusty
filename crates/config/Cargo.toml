[package]
name = "eve-maj-config"
description = "Settings dialog for EVE-Maj Preview"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "eve-maj-config"
path = "src/main.rs"

[dependencies]
eve-maj-core = { path = "../core" }
serde_json = { version = "1", features = ["preserve_order"] }

# The window icon (assets/app.rc), like eve-maj-preview's.
[build-dependencies]
embed-resource = "3"

# On Windows the same page runs in a WebView2 window (config.exe).
[target.'cfg(windows)'.dependencies]
wry = "0.57"
tao = "0.37"
eve-maj-app = { path = "../app" }
eve-maj-win = { path = "../win" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# The dialog's page (ui/, the Zig build's config_dialog.html/css/js and translations) runs in a native WebKitGTK window.
[target.'cfg(target_os = "linux")'.dependencies]
wry = "0.57"
tao = "0.37"
# Same GTK as wry/tao, for the native file and folder pickers.
gtk = "0.18"
libc = "0.2"
