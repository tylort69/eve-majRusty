name: Release

# Pushing a tag such as v1.7.0 builds the Linux binaries and the Windows portable zip (cross-built with MinGW) and
# opens a DRAFT release with them attached.
# Review the draft, write the notes, and publish it by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libegl-dev libgbm-dev \
            libdrm-dev libcairo2-dev libpango1.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev gcc-mingw-w64-x86-64 zip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu
      - name: Test and build
        run: cargo t && cargo linux
      - name: Package
        run: |
          name="eve-maj-rusty-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/x86_64-unknown-linux-gnu/release/eve-maj-preview target/x86_64-unknown-linux-gnu/release/eve-maj-config \
             README.md LICENSE CascadiaCode-LICENSE.txt "$name"/
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Build and package for Windows
        run: |
          cargo build --release
          scripts/package-windows.sh "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $ver' section" >&2; exit 1; }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "EVE-Maj Rusty $GITHUB_REF_NAME" --notes-file notes.md eve-maj-rusty-*.tar.gz* dist/eve-maj-rusty-*-portable.zip*
