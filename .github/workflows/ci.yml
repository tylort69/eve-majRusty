name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  privacy:
    name: Commit emails are private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check new commits use GitHub no-reply addresses
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$AFTER"; else range="-1 $AFTER"; fi
          bad=$(git log --format='%h %ae %ce' $range | awk '{for (i = 2; i <= 3; i++) if ($i !~ /(@users\.noreply\.github\.com|^noreply@github\.com)$/) print $1}' | sort -u)
          if [ -n "$bad" ]; then
            echo "::error::These commits carry an email that is not a GitHub no-reply address: $bad"
            echo "Turn on 'Keep my email addresses private' in GitHub's email settings and recommit."
            exit 1
          fi
          echo "All new commits use no-reply addresses."

  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libegl-dev libgbm-dev \
            libdrm-dev libcairo2-dev libpango1.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo t
      - name: Release build
        run: cargo linux

  windows-cross:
    name: Windows cross-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
