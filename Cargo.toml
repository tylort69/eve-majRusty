[workspace]
resolver = "2"
members = ["crates/core", "crates/win", "crates/app", "crates/preview", "crates/config"]

[workspace.package]
version = "1.6.1"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/tylort69/eve-majRusty"
homepage = "https://github.com/tylort69/eve-majRusty"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
